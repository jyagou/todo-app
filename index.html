<!-- Tells the browser "this file is HTML5" (like a file header, always the first line) -->
<!DOCTYPE html>

<!-- Opens the whole page; everything lives inside <html> ... </html> -->
<html>
<!-- HEAD = info ABOUT the page (not shown on the page itself) -->
 
<head>
  <!-- The text shown on the browser tab -->
  <title>To-Do List</title>
<!-- Connects this HTML page to your CSS file. rel="stylesheet" means "this file is for styling"; href is the file's name -->
<link rel="stylesheet" href="style.css">
<!-- Loads the fonts from Google Fonts. This needs internet, and the page uses them automatically once loaded. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&family=Space+Mono&display=swap" rel="stylesheet">

</head>
<!-- BODY = everything you actually SEE on the page -->
<body>

  <!-- <div> is an invisible box used to group things. class="app" is a name tag so CSS/JS can find it later -->
  <div class="app">

    <!-- HEADER -->
    <!-- <header> is a box for the top part of the page (title area) -->
    <header class="header">
      <!-- <h1> is the biggest heading. Only use one per page -->
      <h1>Todo List</h1>
      <!-- <p> is a paragraph of normal text (your tagline) -->
      <p>Small steps make big progress.</p>
    <!-- Closing tag: every opening tag needs a closing tag with a / -->
    </header>

    <!-- A box that holds the sidebar and main area side by side (we'll do the side-by-side with CSS) -->
    <div class="layout">

      <!-- SIDEBAR -->
      <!-- <aside> is a box for side content, here your category menu -->
      <aside class="sidebar">
        <!-- <ul> = "unordered list", a bullet list. Think of it like a Python list [ ] -->
        <!-- <ul> -->

          <ul>
          <!-- data-category is a custom label we attach to the element so JavaScript can read it later -->
          <!-- <li data-category="All" class="active">All Tasks <span class="count">0</span></li>
          <li data-category="School">School <span class="count">0</span></li>
          <li data-category="Health & Fitness">Health & Fitness <span class="count">0</span></li>
          <li data-category="Personal">Personal <span class="count">0</span></li>
          <li data-category="Others">Others <span class="count">0</span></li> -->  

          <ul>
                <!-- ALL TASKS: home icon -->
                <li data-category="All" class="active">
                  <svg class="icon" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                  <span class="label">All Tasks</span>
                  <span class="count">0</span>
                </li>

                <!-- SCHOOL: graduation cap icon -->
                <li data-category="School">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                  <span class="label">School</span>
                  <span class="count">0</span>
                </li>

                <!-- HEALTH & FITNESS: dumbbell icon -->
                <li data-category="Health & Fitness">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3.5 9v6"/><path d="M20.5 9v6"/><path d="M6.5 12h11"/></svg>
                  <span class="label">Health & Fitness</span>
                  <span class="count">0</span>
                </li>

                <!-- PERSONAL: laptop icon -->
                <li data-category="Personal">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg>
                  <span class="label">Personal</span>
                  <span class="count">0</span>
                </li>

                <!-- OTHERS: star icon -->
                <li data-category="Others">
                  <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                  <span class="label">Others</span>
                  <span class="count">0</span>
                </li>
              </ul>
         </li>
        </ul>
        <!-- </ul> -->
          <!-- Note at the bottom of the sidebar -->
          <div class="sidebar-note">
            <svg class="icon" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
            <p>Better plans brighter days.</p>
          </div>

      </aside>

      <!-- MAIN AREA -->
      <!-- <main> is a box for the main content of the page -->
      <main class="main">

        <!-- Add task bar -->
        <!-- <form> groups input controls together. A form is what lets pressing Enter submit things. You may remember forms from Flask -->
       
            <form class="add-bar">

              <!-- Wrapper so the plus icon can sit INSIDE the text box -->
              <div class="input-wrap">
                <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                <input type="text" class="task-input" placeholder="Add a new task...">
              </div>

              <select>
                <option>School</option>
                <option>Health & Fitness</option>
                <option>Personal</option>
                <option>Others</option>
              </select>

              <input type="datetime-local" class="due-input">

              <button type="submit">Add</button>

            </form>

        <!-- Filters -->
        <!-- A box that holds the three filter buttons -->
        <div class="filters">
          <!-- Plain buttons. They do nothing yet until we add JavaScript -->
         <!-- Each button now has a <span class="count"> inside it. JavaScript will fill in the number. -->
               <button data-filter="all" class="active">All <span class="count">0</span></button>
              <button data-filter="active">Active <span class="count">0</span></button>
              <button data-filter="completed">Completed <span class="count">0</span></button>
                  <!-- The sort dropdown. The value="..." of each option is what JavaScript reads. -->
            <div class="sort-wrap">
              <!-- Sliders icon -->
              <svg class="icon" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
              <select class="sort-select">
                <option value="due">Sort by: Due Date</option>
                <option value="newest">Sort by: Newest</option>
                <option value="name">Sort by: Name (A-Z)</option>
              </select>
            </div>
        </div>

        <!-- Task list (one example task for now) -->
        <!-- Another list <ul>, this one will hold all your tasks -->
        <ul class="task-list"></ul>

        <!-- Footer note under the task list -->
          <div class="footer-note">
            <div class="footer-text">
              <span class="line"></span>
              <span>PROGRESS OVER PERFECTION</span>
              <span class="line"></span>
            </div>
            <!-- Leaf icon -->
            <svg class="icon" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
          </div>

      </main>
    </div>
  </div>
<!-- Loads your JavaScript file. It goes at the bottom so the page's elements exist before the script runs -->
<script src="script.js"></script>
</body>
</html>
